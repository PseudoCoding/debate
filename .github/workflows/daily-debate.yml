name: Daily Debate Update

on:
  schedule:
    # Runs every 4 hours: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
    - cron: '0 */4 * * *'
  # Allow manual triggering from the Actions tab (useful for testing)
  workflow_dispatch:

jobs:
  update-debate:
    runs-on: ubuntu-latest
    permissions:
      # Needed so the workflow can commit and push the updated JSON
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN; write permission granted above
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run debate update script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/update_debate.py

      - name: Commit and push updated conversation
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/conversation.json
          # Only commit if the file actually changed
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            SLOT=$(date -u +"%Y-%m-%d %H:00")
            git commit -m "debate: ${SLOT} UTC — PROMETHEUS vs CASSANDRA [skip ci]"
            git push
          fi
